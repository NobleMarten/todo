server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Встроенный DNS Docker. Без него nginx резолвит имя `backend` один раз
    # при старте и кэширует IP навсегда — после `compose up -d --build`
    # у контейнера новый IP, и прокси начинает отдавать 502 до перезапуска.
    # resolver + переменная в proxy_pass = резолв на каждый запрос.
    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Ассеты Vite содержат хэш в имени → можно кэшировать вечно.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API бэкенда. $request_uri добавлен явно: когда в proxy_pass есть
    # переменная, nginx не собирает целевой URI сам.
    location /todos {
        set $api http://backend:8080;
        proxy_pass $api$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        set $api http://backend:8080;
        proxy_pass $api$request_uri;
        access_log off;
    }

    # SPA: любой неизвестный путь отдаёт index.html.
    # no-cache на index.html, иначе браузер будет держать старую версию
    # и тянуть ассеты, которых после деплоя уже нет.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
